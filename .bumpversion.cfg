[bumpversion]
current_version = 2.3.0
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(dockerpin0):docker/Dockerfile]
search = kafka-mcp[mcp,native]=={current_version}
replace = kafka-mcp[mcp,native]=={new_version}

[bumpversion:file:kafka_mcp/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:kafka_mcp/api_client.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:kafka_mcp/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
