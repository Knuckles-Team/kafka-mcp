[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-mcp"
version = "2.4.4"
description = "Apache Kafka (REST Proxy / native) API + MCP Server + A2A Server for Agentic AI!"
readme = "README.md"
license = "MIT"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12"
dependencies = [ "scion-sdk[mcp]>=0.5.6,<1.0.0", "httpx>=0.28.1", "requests>=2.34.2",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.optional-dependencies]
mcp = [ "scion-sdk[mcp]>=0.5.6,<1.0.0",]
native = [ "confluent-kafka>=2.16.0",]
all = [ "scion-sdk[mcp]>=0.5.6,<1.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
kafka-mcp = "kafka_mcp.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.prompt_providers"]
kafka-mcp = "kafka_mcp.prompts"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
kafka-mcp = "kafka_mcp:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
kafka_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "kafka_mcp*",]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
